<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d">
  <title id="t">Arquitectura multiagente</title>
  <desc id="d">El Supervisor envía trabajo a Worker A (Research) y a Worker B (Synthesis). Worker A pasa su resultado al Validator, que devuelve feedback a Worker B. Worker B entrega al Output Aggregator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d1f"/>
      <stop offset="1" stop-color="#171443"/>
    </linearGradient>
    <linearGradient id="sup" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="out" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d9488"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#8ea2ff"/>
    </marker>
    <marker id="arrowF" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#fbbf24"/>
    </marker>
  </defs>

  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; text-anchor: middle; }
    .name { fill: #fff; font-size: 25px; font-weight: 700; }
    .role { fill: #c7d2fe; font-size: 18px; }
    .edge { fill: none; stroke: #8ea2ff; stroke-opacity: .75; stroke-width: 2.2; marker-end: url(#arrow); }
    .feedback { stroke: #fbbf24; stroke-dasharray: 7 7; marker-end: url(#arrowF); }
    .pulse { fill: none; stroke: #e0e7ff; stroke-width: 4.5; stroke-linecap: round; stroke-dasharray: 5 95; animation: flow 2.8s linear infinite; }
    .pf { stroke: #fde68a; }
    .d1 { animation-delay: -.5s; } .d2 { animation-delay: -1.1s; } .d3 { animation-delay: -1.7s; } .d4 { animation-delay: -2.3s; }
    @keyframes flow { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: 0; } }
  </style>

  <rect width="1000" height="540" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="540" rx="20" fill="url(#grid)"/>

  <!-- Aristas -->
  <path class="edge" d="M260 96 H388"/>
  <path class="edge" d="M612 96 H740"/>
  <path class="edge" d="M150 142 V260 Q150 280 170 280 H388"/>
  <path class="edge feedback" d="M850 142 V260 Q850 280 830 280 H614"/>
  <path class="edge" d="M500 326 V408"/>

  <!-- Flujo animado -->
  <path class="pulse" pathLength="100" d="M260 96 H388"/>
  <path class="pulse d1" pathLength="100" d="M612 96 H740"/>
  <path class="pulse d2" pathLength="100" d="M150 142 V260 Q150 280 170 280 H388"/>
  <path class="pulse pf d3" pathLength="100" d="M850 142 V260 Q850 280 830 280 H614"/>
  <path class="pulse d4" pathLength="100" d="M500 326 V408"/>

  <text x="722" y="266" fill="#fbbf24" font-size="19" font-weight="600">feedback loop</text>

  <!-- Nodos -->
  <g stroke-width="2">
    <rect x="40" y="50" width="220" height="92" rx="16" fill="url(#sup)" stroke="#a78bfa"/>
    <rect x="390" y="50" width="222" height="92" rx="16" fill="#14234d" stroke="#60a5fa"/>
    <rect x="742" y="50" width="218" height="92" rx="16" fill="#3a2a12" stroke="#fbbf24"/>
    <rect x="390" y="234" width="222" height="92" rx="16" fill="#14234d" stroke="#60a5fa"/>
    <rect x="390" y="410" width="222" height="92" rx="16" fill="url(#out)" stroke="#5eead4"/>
  </g>

  <text class="name" x="150" y="93">Supervisor</text>
  <text class="role" x="150" y="121">Agent</text>
  <text class="name" x="501" y="93">Worker A</text>
  <text class="role" x="501" y="121">Research</text>
  <text class="name" x="851" y="93">Validator</text>
  <text class="role" x="851" y="121">Agent</text>
  <text class="name" x="501" y="277">Worker B</text>
  <text class="role" x="501" y="305">Synthesis</text>
  <text class="name" x="501" y="453">Output</text>
  <text class="role" x="501" y="481" style="fill:#d1fae5">Aggregator</text>
</svg>
